workflows:
  android-release:
    name: THE DAY BUSINESS RDC - Android APK
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create Flutter project
        script: flutter create --platforms=android .
      - name: Configure app
        script: |
          mkdir -p assets
          echo  | base64 --decode > pubspec.yaml
          echo  | base64 --decode > lib/main.dart
          echo  | base64 --decode > assets/logo.png
          flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
